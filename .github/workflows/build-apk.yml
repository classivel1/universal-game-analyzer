name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aviator-analyzer-debug-keystore-v1

      - name: Require stable Android signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Signing key cache missing. Refusing to publish an APK with a new signature."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: universal-game-analyzer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Aviator Analyzer v2.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
